<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robust AMC | AI Signal Classifier</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <div class="bg"></div>

    <div class="container">

        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A47.77 47.77 0 0112 21.75c-2.676 0-5.292-.219-7.836-.63-1.717-.293-2.299-2.379-1.067-3.611L5 15.3" />
                    </svg>
                </div>
                <h1>Robust AMC</h1>
            </div>
            <span class="badge">Mixture of Experts AI</span>
        </header>

        <main class="grid">

            <!-- LEFT PANEL -->
            <div class="card">

                <div class="card-title">Dataset Explorer</div>

                <div class="form-group">
                    <label>Modulation Type</label>
                    <select id="modulation">
                        {% for mod in modulations %}
                        <option value="{{mod}}">{{mod}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Channel Model</label>
                    <div class="channel-btns">
                        <button class="channel-btn active" data-channel="AWGN">AWGN</button>
                        <button class="channel-btn" data-channel="Rayleigh">Rayleigh</button>
                        <button class="channel-btn" data-channel="Rician">Rician</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>SNR (dB)</label>
                    <input type="range" id="snrRange" min="-20" max="30" value="10"
                        style="margin-bottom:.5rem">
                    <div style="text-align:center">
                        <span class="snr-val" id="snrVal">10</span>
                        <span class="snr-unit">dB</span>
                    </div>
                </div>

                <button class="btn btn-primary" id="generateBtn" onclick="loadSample()">
                    Pick Random Sample
                </button>

            </div>

            <!-- RIGHT SIDE -->
            <div class="charts-row">

                <!-- CONSTELLATION -->
                <div class="card">
                    <div class="card-title">Constellation Diagram</div>
                    <div class="chart-box">
                        <canvas id="constChart"></canvas>
                    </div>
                </div>

                <!-- CLASSIFICATION -->
                <div class="card">

                    <div class="card-title">Classification</div>

                    <div class="status">
                        <span class="status-dot"></span>
                        <span class="status-text">Model Ready</span>
                    </div>

                    <div id="results" class="hidden">
                        <div class="result-grid">

                            <div class="result-item">
                                <span class="result-label">Prediction</span>
                                <span class="result-value big" id="pred">—</span>
                            </div>

                            <div class="result-item">
                                <div style="width:100%">
                                    <div style="display:flex;justify-content:space-between">
                                        <span class="result-label">Confidence</span>
                                        <span class="result-value" id="conf">—</span>
                                    </div>
                                    <div class="conf-bar">
                                        <div class="conf-fill" id="confBar"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="result-item">
                                <span class="result-label">Expert</span>
                                <span class="expert-tag" id="expert">—</span>
                            </div>

                            <div class="result-item">
                                <span class="result-label">Est. SNR</span>
                                <span class="result-value" id="estSnr">—</span>
                            </div>

                        </div>

                        <div class="prob-chart">
                            <canvas id="probChart"></canvas>
                        </div>

                        <div class="expert-chart">
                            <canvas id="expertChart"></canvas>
                        </div>
                    </div>

                    <p id="noResults">Select a sample and click Pick Random Sample</p>

                </div>

            </div>

        </main>

        <footer>
            Built for Signal Processing Research • Mixture of Experts AMC
        </footer>

    </div>

    <!-- Server-side template injects the modulations array for JS -->
    <script>
        const MODS = [
            {% for mod in modulations %}
            '{{mod}}',
            {% endfor %}
        ];
    </script>

    <script src="/static/main.js"></script>

</body>

</html>
